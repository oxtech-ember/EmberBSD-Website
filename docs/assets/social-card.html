<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>EmberBSD social card source</title>
  <style>
    @font-face { font-family: Sora; src: url('fonts/sora.ttf') format('truetype'); font-weight: 100 800; }
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; background: #faf6ee; color: #302019; font-family: Sora, sans-serif; }
    main { width: 100%; height: 100%; padding: 64px 68px; display: grid; grid-template-columns: 2fr 1fr; gap: 46px; align-items: center; border-bottom: 16px solid #b93c16; }
    .brand { margin: 0 0 36px; font-size: 28px; font-weight: 600; letter-spacing: -.04em; }
    h1 { margin: 0; font-size: 66px; line-height: 1.08; letter-spacing: -.055em; font-weight: 600; }
    h1 span { color: #b93c16; }
    .note { margin: 30px 0 0; font-size: 19px; color: #6d5a4e; }
    .mascot { display: flex; align-items: center; justify-content: center; border-radius: 140px 18px 140px 18px; background: #f4dfba; width: 352px; height: 448px; }
    img { width: 270px; height: auto; }
  </style>
</head>
<body>
  <main>
    <div><p class="brand">EmberBSD</p><h1>Unix for<br><span>creators</span> and<br>creatures.</h1><p class="note">An open system. A world of possibilities.</p></div>
    <div class="mascot"><img src="emberbsd-logo.png" width="1181" height="1331" alt="The original EmberBSD flame mascot"></div>
  </main>
</body>
</html>
